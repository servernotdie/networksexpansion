    - '<passive> (Các) Nhà phát triển: ytdd9527, balugaq'
    - '<passive> Trang GitHub của Nhà phát triển: <click_info>https://github.com/ytdd9527'
    - '<passive> Trang GitHub của Nhà phát triển: <click_info>https://github.com/balugaq'
    - '<passive> Link tải NetworksExpansion bản ổn định: https://builds.guizhanss.com/ytdd9527/NetworksExpansion/master/builds'
    - '<passive> Liên kết tải xuống phiên bản mạng mở rộng dành cho nhà phát triển:
      https://github.com/balugaq/NetworksExpansion'
    - <passive> Cảm ơn tất cả mọi người đã đóng góp vấn đề, PR và xác nhận cho sự
      phát triển của NetworksExpansion!
    - <passive> Cảm ơn tất cả mọi người đã đưa ra gợi ý cho sự phát triển của NetworksExpansion!
    - <passive> Cảm ơn người chơi Utoboy, TouRuya, haiman233, yitoudaidai, tinalness,
      matl114 vì những gợi ý của họ về sự phát triển của Mạng mở rộng!
    - <passive> Cảm ơn lần nữa :>
  NTW_EXPANSION_ANNOUNCE_10:
    name: <color_random_string>Mạng lưới mở rộng lối chơi trải nghiệm tuyên bố
    lore:
    - <warning> Trước khi đọc tuyên bố này, hãy đảm bảo đọc thông tin về bản phát
      hành Networks Expansion.
    - '<passive> Về việc mạng máy bị mất bản thiết kế, theo thông báo từ nhà phát
      triển slime:'
    - <passive> ——Khi dữ liệu PDC của dự án quá lớn, dự án không thể được lưu vào
      cơ sở dữ liệu slime. Chủ sở hữu máy chủ cần tự điều chỉnh kiểu dữ liệu của bảng
      cơ sở dữ liệu
    - <passive> - Bật tùy chọn `bypass-item-length-check` trong Cài đặt để bỏ qua
      việc kiểm tra độ dài mục.
    - <passive> PDC bản thiết kế của bộ tổng hợp mạng thường rất lớn, điều này là
      để tương thích với các thiết kế cũ của vài năm trước và đảm bảo trải nghiệm
      chơi trò chơi của người chơi.
    - '<passive> Thêm vào đó, theo thử nghiệm của matl114, việc nâng cấp thiết bị
      tại chỗ cũng có thể dẫn đến việc đồ vật bị thất lạc:'
    - '<passive> Đây là một ví dụ <warning>có thể<passive> có thể lặp lại: Đặt máy
      A, đặt C mặt hàng D vào khe B, đào ra và thay thế bằng máy E, và đặt C mặt hàng
      D vào khe B'
    - <passive> Sau khi máy chủ được khởi động lại, mặt hàng D trong máy E sẽ biến
      mất.
    - <passive> Những lý do trên ít liên quan đến việc mở rộng mạng, khi chơi nên
      giữ cái đầu tỉnh táo, không nên công kích việc mở rộng mạng một cách vô thức.
    - <passive> Gần đây, cũng có những tin đồn như <warning>"Sử dụng Bộ mở rộng mạng
      tổng hợp sẽ không làm mất bản thiết kế"<passive> được lan truyền.
    - <passive> Mong các bạn hãy luôn sáng suốt và không để bị đánh lừa bởi những
      tin đồn tương tự.
    - <passive> Tuyên bố kết thúc ở đây.
  NTW_EXPANSION_WORKBENCH:
    name: Bàn làm việc mở rộng mạng
    lore:
    - Nhiều vật liệu và máy móc khác nhau có thể được tổng hợp để mở rộng mạng
  NTW_EXPANSION_WORLD_EDIT_AXE:
    name: Chế tạo mạng lưới Slime
    lore:
    - Chỉ quản trị viên mới có thể sử dụng
    - Nhấp chuột trái để chọn vị trí đầu tiên
    - Nhấp chuột phải để chọn vị trí thứ hai
    - '&cMục này đã không còn được dùng nữa'
    - '&cVui lòng sử dụng các mặt hàng SFWorldEdit Slime Creation God'
  NTW_EXPANSION_INFO_TOOL:
    name: Công cụ thông tin mạng
    lore:
    - Chỉ quản trị viên
    - Nhấp chuột phải để xem thông tin chi tiết của các thành phần trong mạng
  NTW_EXPANSION_ADVANCED_IMPORT:
    name: Lối vào mạng nâng cao
    lore:
    - Các lối vào mạng nâng cao đưa các mục vào mạng
    - Có thể truyền tối đa 54 nhóm vật phẩm trên mỗi dấu SF
    - Có khả năng nhận hàng từ mạng lưới vận chuyển
  NTW_EXPANSION_ADVANCED_EXPORT:
    name: Mạng xuất khẩu nâng cao
    lore:
    - Đầu ra mạng nâng cao có thể được thiết lập cho
    - Tiếp tục gửi một số lượng vật phẩm được chỉ định ra khỏi mạng
    - Các mặt hàng có thể được trích xuất bằng cách sử dụng mạng lưới vận chuyển
  NTW_EXPANSION_ADVANCED_PURGER:
    name: Công cụ dọn dẹp mạng nâng cao
    lore:
