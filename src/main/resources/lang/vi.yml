items:
  NTW_EXPANSION_ANNOUNCE_1:
    name: <color_random_string>Định nghĩa
    lore:
    - <warning> 1) Tuyên bố Đề cập đến tất cả các tuyên bố ở đây.
    - <warning> 2) Mạng(Networks) Đề cập đến một addon slime, không phải là một mạng
      theo nghĩa của Internet, Internet vạn vật, v.v., hoặc các mạng khác theo nghĩa
      truyền thống.
    - <warning> 3) NetworksExpansion (sau đây gọi là "NetworksExpansion", "addon này"
      hoặc "dự án này") là một addon Slimefun. Nhóm phát triển NetworksExpansion dựa
      trên Mạng, tuân thủ nghiêm ngặt giao thức GPLv3, thực hiện các bổ sung, xóa
      và sửa đổi thích hợp. Addon này dựa trên Paper 1.20.1, addon công nghệ slime
      phiên bản tiếng Trung và không tương thích hoàn toàn với Slimefun4 từ Paper
      1.20.5 trở lên.
    - <warning> 4) Những nhà phát triển NetworksExpansion (sau đây gọi là "Nhóm phát
      triển NetworksExpansion", "Những người sáng tạo NetworksExpansion") là một nhóm
      phát triển NetworksExpansion, và không thuộc sở hữu của bất kỳ công ty hay tổ
      chức nào.
  NTW_EXPANSION_ANNOUNCE_2:
    name: <color_random_string>Tuyên bố về các tác phẩm của NetworksExpansion
    lore:
    - <warning> Vui lòng đảm bảo đọc các định nghĩa trước khi đọc tuyên bố này.
    - <warning> 1) NetworksExpansion hoàn toàn miễn phí, được chia sẻ và có nguồn
      mở trên GitHub cho phần lớn những người ủng hộ, bảo trì và người sáng tạo để
      tìm hiểu và sử dụng.
    - <warning> 2) Giao thức GPLv3 Là thỏa thuận nguồn mở cho NetworksExpansion. Bất
      kỳ ai cũng có thể tự do sử dụng, sửa đổi và phân phối nó. Tuy nhiên, mọi sửa
      đổi và phân phối đều phải tuân thủ giao thức GPLv3.
    - <warning> 3) Trong số đó, "Mạng mở rộng" chỉ là tiêu đề của tệp này và không
      bao gồm bất kỳ sự mơ hồ hoặc ý nghĩa trục lợi nào.
    - <warning> 4) Các nhà phát triển NetworksExpansion chỉ hoạt động với tư cách
      là người tạo ra tiện ích bổ sung này. Họ không cung cấp bất kỳ hỗ trợ thương
      mại nào cho tiện ích này cũng như không tích cực duy trì tiện ích bổ sung này
      nữa. Ngoài ra, các nhà phát triển NetworksExpansion chưa bao giờ tham gia vào
      bất kỳ hoạt động kinh doanh trực tiếp hay gián tiếp nào liên quan đến bất kỳ
      máy chủ nào.
    - <warning> 5) Nghiêm cấm sử dụng các plug-in nói trên và các tệp đính kèm của
      chúng để quảng bá thông tin tiêu cực hoặc bạo lực dưới mọi hình thức; nghiêm
      cấm sử dụng các tệp nói trên cho các hoạt động bất hợp pháp hoặc xâm phạm; các
      tệp để tham gia vào bất kỳ nội dung nào liên quan đến chính trị hoặc thô tục.
    - <warning> 6) Nghiêm cấm bán lại, bao gồm nhưng không giới hạn ở các hoạt động
      giao dịch được ngụy trang, làm xáo trộn trái phép và sử dụng các tài liệu nói
      trên vì bất kỳ mục đích lợi nhuận nào.
    - <warning> 7) Chúng tôi cực lực lên án các mục bị nghiêm cấm ở trên và khuyến
      khích công chúng giám sát lẫn nhau, đồng thời tích cực báo cáo các hành vi vi
      phạm và các hành vi bất hợp pháp.
    - <warning> 8) Nếu hậu quả xảy ra do bạn hoặc nhóm của bạn sử dụng không đúng
      cách, bạn phải chịu hậu quả. Nghiêm cấm trốn tránh trách nhiệm cho những người
      bảo trì và người tạo plugin ở trên; và các tập tin cấu hình dưới mọi hình thức.
    - <warning> 9) Đối với người xâm phạm tùy trường hợp mà phải chịu trách nhiệm
      dân sự như đình chỉ việc vi phạm, loại bỏ ảnh hưởng, xin lỗi, bồi thường thiệt
      hại...; đồng thời nếu lợi ích chung thì phải chịu trách nhiệm dân sự. bị thiệt
      hại, cơ quan quản lý hành chính về quyền tác giả có thể ra lệnh đình chỉ việc
      vi phạm và tịch thu số tiền thu được bất hợp pháp, Tịch thu và tiêu hủy các
      bản sao vi phạm và có thể bị phạt tiền; nếu trường hợp đó nghiêm trọng và cấu
      thành tội phạm, hình sự; trách nhiệm sẽ được truy cứu theo pháp luật.
    - <warning> 10) Khi các nhà phát triển Mạng mở rộng không truy cứu hành vi xâm
      phạm của người vi phạm thì không có nghĩa là nhà phát triển Mạng mở rộng xác
      nhận hành vi vi phạm. Điều này cũng không có nghĩa là người vi phạm không phải
      chịu bất kỳ trách nhiệm nào.
    - <warning> Bạn hãy nhớ tuân thủ tuyên bố trên.
  NTW_EXPANSION_ANNOUNCE_3:
    name: <color_random_string>Tuyên bố sử dụng NetworksExpansion
    lore:
    - <warning> Vui lòng đảm bảo đọc Tuyên bố về Công việc của NetworksExpansion trước
      khi đọc tuyên bố này.
    - <warning> GuizhanLibPlugin Đây là plugin tiên quyết cho tiện ích bổ sung này,
      vui lòng đảm bảo nó được cài đặt chính xác.
    - <warning> Phiên bản phát triển Phiên bản bản địa hóa Slimefun Đây là plugin
      tiền đề cho tiện ích mở rộng này, vui lòng đảm bảo nó được cài đặt chính xác.
    - '<warning> Khi sử dụng NetworksExpansion hoặc nội dung NetworksExpansion, bạn
      phải tuân thủ pháp luật và các quy định. Bạn không được sử dụng Mạng mở rộng
      hoặc Nội dung NetworksExpansion để tham gia vào các hành vi trái pháp luật và
      quy định, bao gồm nhưng không giới hạn ở các hành vi sau:'
    - <warning> 1. Vi phạm các nguyên tắc cơ bản được quy định trong Hiến pháp;
    - <warning> 1) Gây nguy hiểm cho an ninh quốc gia, làm rò rỉ bí mật nhà nước,
      lật đổ chính sách quốc gia và phá hoại sự thống nhất quốc gia;
    - <warning> 2) Gây thiệt hại đến danh dự và lợi ích quốc gia;
    - <warning> 3) Xuyên tạc, làm xấu, bôi nhọ, phủ nhận việc làm, tinh thần của các
      anh hùng, liệt sĩ và dùng những lời lăng mạ, vu khống, bằng cách khác xâm phạm
      đến họ tên, hình ảnh, uy tín, danh dự của các anh hùng, liệt sĩ;
    - <warning> 4) Ủng hộ chủ nghĩa khủng bố, chủ nghĩa cực đoan hoặc xúi giục thực
      hiện các hoạt động khủng bố hoặc hoạt động cực đoan;
    - <warning> 5) Kích động hận thù, phân biệt đối xử dân tộc và phá hoại sự đoàn
      kết dân tộc;
    - <warning> 6) Phá hoại chính sách tôn giáo của đất nước, thúc đẩy tà giáo và
      mê tín phong kiến;
    - <warning> 7) Truyền bá tin đồn, gây rối trật tự xã hội và trật tự xã hội;
    - <warning> 8) Phát tán nội dung tục tĩu, nội dung khiêu dâm, cờ bạc, bạo lực,
      giết người, khủng bố hoặc xúi giục tội phạm;
    - <warning> 9) Xúc phạm, vu khống người khác, xâm phạm uy tín, quyền riêng tư
      và các quyền, lợi ích hợp pháp khác của người khác;
    - <warning> 10) Vi phạm đạo đức xã hội;
    - <warning> 11) Các nội dung khác bị cấm theo luật pháp, quy định hành chính và
      quy định quốc gia.
    - '<warning> 2. Bạn không được sử dụng NetworksExpansion hoặc nội dung NetworksExpansion
      để sản xuất, sao chép hoặc xuất bản những thông tin không tốt sau:'
    - <warning> 1) Việc sử dụng tiêu đề quá dài, nội dung không phù hợp nghiêm trọng
      với tiêu đề;
    - <warning> 2) Thúc đẩy các vụ bê bối, bê bối, hành vi sai trái, v.v.;
    - <warning> 3) Đưa ra những nhận xét không phù hợp về thiên tai, tai nạn lớn và
      các thảm họa khác;
    - <warning> 4) Những gợi ý tình dục, sự trêu chọc tình dục, v.v. có khả năng khiến
      mọi người liên tưởng đến tình dục;
    - <warning> 5) Thể hiện sự đẫm máu, kinh dị, độc ác, v.v., có thể gây khó chịu
      về thể chất và tinh thần;
    - <warning> 6) Kích động phân biệt đối xử với đám đông, phân biệt đối xử theo
      khu vực, v.v.;
    - <warning> 7) Quảng bá nội dung thô tục, tầm thường, mang tính chủ nghĩa;
    - <warning> 8) Nó có thể khiến trẻ vị thành niên bắt chước các hành vi không an
      toàn, vi phạm đạo đức xã hội hoặc lôi kéo trẻ vị thành niên thực hiện những
      thói quen xấu, v.v.;
    - <warning> 9) Nội dung khác gây ảnh hưởng không tốt đến hệ sinh thái mạng.
  NTW_EXPANSION_ANNOUNCE_4:
    name: <color_random_string>Tuyên bố tác giả NetworksExpansion
    lore:
    - <warning> Trước khi đọc tuyên bố này, hãy đảm bảo đọc Tuyên bố sử dụng mạng
      mở rộng.
    - <warning> 1) Tất cả các thành viên trong nhóm phát triển NetworksExpansion đều
      là công dân của Cộng hòa Nhân dân Trung Hoa, đều thực lòng ủng hộ các lý thuyết
      về chủ nghĩa xã hội đặc sắc Trung Quốc và tuân thủ sự lãnh đạo của Đảng Cộng
      sản Trung Quốc.
    - <warning> 2) Các thành viên trong nhóm phát triển NetworksExpansion phản đối
      những tư tưởng suy đồi và lạc hậu như chủ nghĩa tư bản, chủ nghĩa đế quốc, chủ
      nghĩa bá quyền và chủ nghĩa phong kiến.
    - <warning> 3) Các thành viên trong nhóm phát triển NetworksExpansion tuân thủ
      hiến pháp và pháp luật một cách có ý thức, đồng thời phản đối bạo lực mạng.
    - <warning> 4) Thành viên nhóm phát triển NetworksExpansion có ý thức tuân thủ
      nội quy cộng đồng, không dùng ngôn ngữ tục tĩu mà hãy giao tiếp một cách văn
      minh.
    - <warning> 5) Bất kỳ hành vi lăng mạ, tấn công Nhóm phát triển Mạng mở rộng hoặc
      các thành viên của Nhóm phát triển Mạng mở rộng sẽ bị xử lý theo quy định của
      pháp luật. Nếu phát hiện thấy bạo lực mạng như "Mở hộp", cảnh sát sẽ được báo
      cáo.
    - <warning> 6) Tuyên bố này chỉ thể hiện quan điểm của nhóm phát triển NetworksExpansion,
      không đại diện cho người khác, bất kỳ trò chơi, tổ chức, công ty, quốc gia,
      nhóm xã hội nào và không đại diện cho bất kỳ nhóm người chơi trò chơi nào.
    - <warning> 7) Về mặt chủ quan, tuyên bố này không thiên vị bất kỳ bên nào mà
      chỉ nhằm vào bản thân sự việc chứ không hướng vào con người.
    - <passive> Bản mod này được viết bởi Sefiraat, được bản địa hóa bởi ybw0014,
      và được bổ sung, xóa và sửa đổi cũng như bảo trì sau đó bởi yitoudaidai và tinalness.
    - <passive> Nhờ các tác giả từ logic (LogiTech) băm cái đầu do máy cung cấp.
    - <passive> Cảm ơn tất cả các chủ sở hữu máy chủ đã đặt niềm tin vào bạn và cài
      đặt Network Expansion.
    - <passive> Bản mod này được lấy cảm hứng từ phần lớn người chơi.
    - <passive> Đặc biệt cảm ơn những người chơi như Utoboy, TouRuya, haiman233, matl114
      vì những nhận xét của họ.
    - <passive> Cảm ơn những người thử nghiệm Utoboy, TouRuya, haiman233, yitoudaidai,
      tinalness, matl114, lengshang để thử nghiệm.
  NTW_EXPANSION_ANNOUNCE_5:
    name: <color_random_string>Các liên kết liên quan đến NetworksExpansion
    lore:
    - <warning> Trước khi đọc tuyên bố này, vui lòng đọc Tuyên bố tác giả mở rộng
      mạng.
    - '<passive> Sau đây là các liên kết liên quan đến Mạng mở rộng: (Vui lòng tìm
      liên kết duy nhất)'
    - '<passive> Liên kết trạm xây dựng mở rộng mạng lưới: <click_info>https://builds.guizhanss.com/ytdd9527/NetworksExpansion/master/builds'
    - '<passive> Kho GitHub ổn định mở rộng mạng: <click_info>https://github.com/ytdd9527/NetworksExpansion'
    - '<passive> Liên kết Sự cố GitHub ổn định mở rộng mạng: <click_info>https://github.com/ytdd9527/NetworksExpansion/issues'
    - '<passive> Liên kết PR GitHub của Mạng ổn định mở rộng: <click_info>https://github.com/ytdd9527/NetworksExpansion/pulls'
    - '<passive> Phiên bản phát triển mở rộng mạng Kho GitHub: <click_info>https://github.com/balugaq/NetworksExpansion'
    - <warning> Phiên bản phát triển Mạng mở rộng không chấp nhận các sự cố trên GitHub
    - <warning> Phiên bản phát triển Mạng mở rộng không chấp nhận PR của GitHub
    - '<passive> Mạng lưới tác giả bản mở rộng Trang GitHub: <click_info>https://github.com/ytdd9527'
    - '<passive> Mạng lưới tác giả bản mở rộng Trang GitHub: <click_info>https://github.com/balugaq'
  NTW_EXPANSION_ANNOUNCE_6:
    name: <color_random_string>Mục đích của NetworksExpansion
    lore:
    - <warning> Trước khi đọc tuyên bố này, vui lòng đảm bảo đọc các liên kết liên
      quan đến NetworksExpansion.
    - <passive> Mục đích của NetworksExpansion là cung cấp nhiều sự thuận tiện, tiện
      lợi hơn trên cơ sở của Mạng và nâng cao chức năng giao thông vận tải của Mạng.
    - <passive> Đồng thời, mạng cũng cần giảm độ trễ do mạng gây ra càng nhiều càng
      tốt, giảm thiểu các lỗ hổng, lỗi do mạng gây ra.
  NTW_EXPANSION_ANNOUNCE_7:
    name: <color_random_string>Câu hỏi thường gặp về NetworksExpansion
    lore:
    - <warning> Trước khi đọc câu lệnh này, hãy chắc chắn đọc Mục đích của NetworksExpansion.
    - <warning> 1) Tại sao NetworksExpansion lại được sửa đổi thường xuyên và đôi
      khi có những sự cố lạ xảy ra?
    - <passive> - Đây là điều bình thường, nhóm phát triển NetworksExpansion không
      thể đảm bảo rằng mọi phiên bản đều hoạt động hoàn hảo. Nếu có thể, hãy sử dụng
      phiên bản ổn định từ trang xây dựng.
    - <warning> 2) Tại sao một số tính năng tuyệt vời không được thêm vào NetworksExpansion?
    - <passive> - Do tính chất của Mạng mở rộng, một số tính năng có thể không phù
      hợp để sử dụng trong Mạng vì Mạng là một hệ thống giao thông.
    - <warning> 3) Tại sao một số tính năng đã được triển khai tạo điều kiện cho người
      chơi bị xóa trong các phiên bản sau?
    - <passive> - Việc loại bỏ các tính năng hiện có là một quyết định được nhóm phát
      triển Mạng mở rộng đưa ra sau khi xem xét lâu dài và không thể xóa tùy ý.
    - <passive> - Thông thường, một số tính năng sẽ bị xóa do độ trễ quá cao, dẫn
      đến có nhiều lỗ hổng hơn.
    - <passive> - Tất nhiên, cũng sẽ có trường hợp thành viên của nhóm phát triển
      Mạng Mở Rộng bị xóa do tấn công bằng lời nói, hành vi ác ý và các lý do khác.
  NTW_EXPANSION_ANNOUNCE_8:
    name: <color_random_string>Mô tả bổ sung mở rộng mạng
    lore:
    - <warning> Trước khi đọc câu lệnh này, hãy nhớ đọc phần Câu hỏi thường gặp về
      mở rộng mạng.
    - <warning> 1) Các nhà phát triển NetworksExpansion không có nghĩa vụ duy trì
      tiện ích bổ sung này. Nếu có bất kỳ lỗi, lỗ hổng hoặc vấn đề đột ngột nào trong
      bản mở rộng mạng ổn định, vui lòng gửi Vấn đề về phiên bản ổn định của tiện
      ích bổ sung này; Kho lưu trữ trên kho lưu trữ GitHub kịp thời.
    - <passive> 2) Chúng tôi không thể đảm bảo rằng mọi vấn đề sẽ được khắc phục kịp
      thời, nhưng chúng tôi sẽ cố gắng hết sức để khắc phục chúng.
    - <passive> 3) Khi liên lạc với nhà phát triển, bạn nên lịch sự, đừng công kích
      hay lăng mạ bö ác ý. Đây là cách giao tiếp hiệu quả để giải quyết vấn đề của
      bạn.
    - <warning> 4) Bằng việc sử dụng, chơi hoặc sửa đổi bản mở rộng Mạng, bạn mặc
      định đồng ý tuân thủ các tuyên bố này.
    - <passive> 5) Nhà phát triển NetworksExpansion có quyền sửa đổi hoặc chấm dứt
      tuyên bố này bất cứ lúc nào.
    - <warning> 6) Sau khi tuyên bố này được cập nhật, bạn nên tự giác kiểm tra xem
      có phản đối nào không. Nhìn chung, sau khi phiên bản được cập nhật, nhóm phát
      triển Mạng mở rộng mặc định rằng bạn đồng ý tuân thủ các tuyên bố này.
    - <passive> 7) Bạn nên tránh sử dụng "Mở rộng mạng lưới" hoặc "Nhóm phát triển
      NetworksExpansion" hoặc "Thành viên nhóm phát triển NetworksExpansion" vì việc
      sử dụng chức năng mở rộng mạng lưới để tham gia vào chính trị và các sự kiện
      công cộng. <warning>Nếu không thì nhóm phát triển NetworksExpansion có quyền
      đình chỉ hoặc chấm dứt việc bảo trì Mở rộng mạng.
    - <passive> 8) Nếu có các phiên bản tuyên bố này bằng các ngôn ngữ khác do nhà
      phát triển Mạng mở rộng xuất bản thì phiên bản tiếng Trung sẽ được ưu tiên áp
      dụng.
    - <passive> 9) Hiệu lực, việc thực hiện, giải thích và giải quyết tranh chấp của
      tuyên bố này sẽ chịu sự điều chỉnh của pháp luật Trung Quốc đại lục (trừ xung
      đột pháp luật)
    - <passive> 10) Tất cả các tiêu đề trong câu lệnh này chỉ nhằm mục đích thuận
      tiện cho việc đọc và bản thân chúng không có bất kỳ ý nghĩa thực tế nào, cũng
      như không thể được sử dụng làm cơ sở để giải thích ý nghĩa của câu lệnh này.
    - <warning> 11) Nếu một phần của điều khoản này bị vô hiệu vì bất kỳ lý do gì,
      các quy định còn lại sẽ vẫn có hiệu lực và ràng buộc các bên.
    - <warning> 12) Nếu màn hình quá nhỏ hoặc vì lý do nào đó mà bạn không thể xem
      toàn bộ nội dung của báo cáo, vui lòng tự điều chỉnh. Đội ngũ phát triển Mạng
      Mở Rộng không chịu bất kỳ trách nhiệm nào cho việc này.
    - <warning> 13) Nếu bạn không thể xem toàn bộ tên vật phẩm hoặc nội dung giải
      thích vật phẩm do kích thước màn hình quá nhỏ hoặc các lý do khác, chủ sở hữu
      máy chủ hoặc người chơi nên tự khắc phục. Nhóm phát triển Mạng Mở Rộng không
      chịu bất kỳ trách nhiệm nào về việc này.
    - <warning> 14) NetworksExpansion cho phép bất kỳ ai sử dụng, sao chép, sửa đổi,
      hợp nhất, xuất bản, phân phối, trưng bày hoặc phân phối tuyên bố này cho mục
      đích phi lợi nhuận, nhưng không ai được sử dụng tuyên bố này cho mục đích thương
      mại. Và không được thực hiện tuyên truyền nhân danh mạng mở rộng hoặc nhóm phát
      triển Mạng mở rộng.
    - <warning> 15) Quyền giải thích tất cả các nội dung khai báo của Addon này thuộc
      về Nhà phát triển NetworksExpansion.
  NTW_EXPANSION_ANNOUNCE_9:
    name: <color_random_string>Thông tin phiên bản mở rộng mạng
    lore:
    - <warning> Vui lòng đảm bảo đọc Mô tả bổ sung về mở rộng mạng trước khi đọc tuyên
      bố này.
    - <passive> Bạn có thể cung cấp trang này làm thông tin phiên bản khi cung cấp
      phản hồi về các sự cố liên quan đến NetworksExpansion.
    - '<passive> Nhưng xin nhắc lại lần nữa:'
    - <warning> Phiên bản phát triển mở rộng mạng không chấp nhận GitHub Issues
    - <warning> Phiên bản phát triển Mạng mở rộng không chấp nhận PR của GitHub
    - '<passive> Thông tin phiên bản:'
