    - Di chuyển chúng qua kho máy móc sử dụng.
    - ''
    - '<click_info>Mức điện trữ: &732,768J'
  NTW_EXPANSION_LINE_POWER_OUTLET_6:
    name: Lõi truyền điện chuỗi đa nhiệm (6)
    lore:
    - Trạm điện tiếp nối có tác dụng lưu điện phân tán của máy chủ chung
    - Trao trả điện qua việc lưu trữ tại bộ phận cấp nguồn cho công trình.
    - ''
    - '<click_info>Năng lượng tích trữ: &7262,144J'
  NTW_EXPANSION_LINE_POWER_OUTLET_7:
    name: Khe chứa điện năng lượng mạng chuỗi (7)
    lore:
    - Cổng kết nối mạng lưới chia sẻ nguồn năng lượng
    - Lấy từ máy chủ mạng chuyển lên thiết bị chỉ định.
    - ''
    - '<click_info>Tổng trữ lượng: &72,097,152J'
  NTW_EXPANSION_LINE_POWER_OUTLET_8:
    name: Bộ tiếp nhận ổ điện kết nối chuỗi mạng (8)
    lore:
