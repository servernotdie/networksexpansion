    help:
    - '&6Trợ giúp lệnh mạng:'
    - '&6/networks help - Hiển thị thông báo trợ giúp này.'
    - '&6/networks fillquantum <amount> - Đặt số lượng vật phẩm trong kho lưu trữ
      lượng tử đang cầm trên tay.'
    - '&6/networks fixblueprint <keyInMeta> - Sửa bản thiết kế tổng hợp đang cầm trên
      tay.'
    - '&6/networks addstorageitem <amount> - Thêm vật phẩm vào ngăn kéo mạng mà bạn
      đang nhìn vào.'
    - '&6/networks reducestorageitem <amount> - Giảm vật phẩm khỏi ngăn kéo mạng mà
      bạn đang nhìn vào.'
    - '&6/networks setquantum <amount> - Đặt số lượng lưu trữ cho vật phẩm lưu trữ
      lượng tử cầm tay.'
    - '&6/networks setcontainerid <containerId> - Đặt ID kho chứa của ngăn kéo mạng.'
    - '&6/networks worldedit <subCommand> - Tính năng SlimeWorldEdit.'
    - '&6/networks updateItem - Cập nhật vật phẩm đang cầm.'
    - '&6/networks getstorageitem <slot> - Nhận vật phẩm từ ô đã chỉ định của ngăn
      kéo mạng mà bạn đang nhìn vào.'
    - '&6/networks viewLog - Hiển thị nhật ký đầu ra của AdminDebuggable mà bạn đang
      nhìn vào.'
    example:
      help:
      - '&6/networks help - Hiển thị thông báo trợ giúp này.'
      - '&6ex: /networks help'
      fillquantum:
      - '&6/networks fillQuantum <amount> - Đặt sức chứa của Kho Lưu trữ Lượng tử
        trên tay.'
      - '&6ex: /networks fillQuantum 1000'
      fixblueprint:
      - '&6/networks fixBlueprint <keyInMeta> - Sửa bản thiết kế tổng hợp trên tay.'
      - '&6ex: /networks fixBlueprint networks-changed'
      addstorageitem:
      - '&6/networks addStorageItem <amount> - Thêm một số lượng vật phẩm nhất định
        đang cầm vào kho hàng đang nhìn vào.'
      - '&6ex: /networks addstorageItem 1000'
      reducestorageitem:
      - '&6/networks reduceStorageItem <amount> - Giảm một số lượng vật phẩm nhất
        định đang cầm khỏi kho hàng đang nhìn vào.'
      - '&6ex: /networks reduceStorageItem 1000'
      setquantum:
      - '&6/networks setQuantum <amount> - Đặt vật phẩm của kho lưu trữ lượng tử đang
        nhìn thành vật phẩm đang cầm trên tay, và đặt một số lượng lưu trữ nhất định.'
      - '&6ex: /networks setQuantum 1000'
      setcontainerid:
      - '&6/networks setContainerId <containerId> - Đặt ID vùng chứa của kho hàng
        đang nhìn.'
      - '&6ex: /networks setContainerId 6'
      getstorageitem:
      - '&6/networks getStorageItem <slot> - Nhận vật phẩm của ô được chỉ định từ
        kho hàng đang nhìn.'
      - '&6ex: /networks getStorageItem 0'
      worldedit:
      - '&6/networks worldedit <subCommand> - Tính năng SlimeWorldEdit.'
      - '&6/networks worldedit pos1 - Chọn vị trí đầu tiên'
      - '&6/networks worldedit pos2 - Chọn vị trí thứ hai'
      - '&6/networks worldedit paste <sfid> <handler> <force> - Dán khối Slimefun'
      - '&6/networks worldedit clear <callHandler> <skipVanilla> - Xóa khối Slimefun'
      - '&6/networks worldedit blockMenu setSlot <slot> - Đặt vật phẩm trên tay vào
        ô tương ứng trong menu của khối Slimefun trong khu vực đã chọn'
      - '&6/networks worldedit blockInfo add <key> <value> - Thêm thông tin khối Slimefun'
      - '&6/networks worldedit blockInfo remove <value> - Xóa thông tin khối Slimefun'
      - '&6/networks worldedit blockInfo set <key> <value> - Đặt thông tin khối Slimefun'
      - '&6/networks worldedit clone - Sao chép khu vực đã chọn đến vị trí của bạn'
      - '&6/networks worldedit clearPos - Xóa vị trí đã chọn'
      - '&6/networks worldedit showAreaOutline - Hiển thị viền ngoài khu vực đã chọn'
      updateitem:
      - '&6/networks updateItem - Cập nhật vật phẩm trên tay.'
      - '&6ex: /networks updateItem'
      viewlog:
      - '&6/networks viewLog - In nhật ký của AdminDebuggable đang được trỏ tới.'
      - '&6ex: /networks viewLog'
      unknown-command:
      - <error>Lệnh không xác định! Hãy dùng /networks help để xem thông tin trợ giúp.
