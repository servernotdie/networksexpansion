    - ''
    - '<click_info>Sử dụng mạng lưới: &71,280 để hoàn thành cấu trúc'
  NTW_EXPANSION_ADVANCED_AUTO_PRESSURE_CHAMBER:
    name: Hệ thống Máy nén tự động Cao cấp
    lore:
    - Hệ thống buồng nén lưới điện tự động nâng cao sử dụng thông số dự án Phòng nén
      để hoạt động.
    - Khi đối tượng thiết kế không hoạt động trên hệ thống mạng,
    - Bộ máy lấy thông tin cần thiết trực tuyến vào việc tổng hợp
    - Công việc xếp chồng có hỗ trợ (Máy trước đó bị bỏ)
    - (Yêu cầu lượng nguyên liệu không bị khan hiếm trên toàn hệ thống)
    - ''
    - '<click_info>Điện sử dụng từ mạng điện: &7640 một vòng cấu thành'
  NTW_EXPANSION_ADVANCED_AUTO_PRESSURE_CHAMBER_WITHHOLDING:
    name: Máy Nén Phân bổ Tiên tiến Trực tuyến (Bản lưu trước)
    lore:
    - Bộ phận phân áp tiên tiến thông qua dự án Máy Nén để thực thi.
    - Nếu vật liệu dự án thiếu trên hệ thống trực tuyến,
    - Nền tảng lấy đồ từ máy chủ vào khối tổng hợp tự động
    - Thiết kế xếp lớp là khả thi (Không quay lại các phiên bản máy trước đó)
    - (Có yêu cầu sự cung cấp toàn vẹn vật liệu ở phần lưới)
    - ''
    - Mẫu cấu hình bảo quản tiến hành duy trì vận hành lắp ráp
    - Cho tới khi hệ thống đầu ra sở hữu 1 cụm mô-đun
    - Người chơi dễ dàng kiểm tra thiết bị qua mạng
    - Có thể lấy ngay thông qua hệ thống đưa đi
    - ''
    - '<click_info>Năng lượng hấp thu từ lưới trung tâm: &71,280 một máy hoạt động'
  NTW_EXPANSION_ADVANCED_AUTO_CRAFTING:
    name: Máy Lắp Ráp Tự Động Nâng Cao Trực Tuyến
    lore:
    - Trạm lắp ráp tự động trên mạng cao cấp yêu cầu thông số dự án Thiết bị Tự ráp
      để khởi chạy.
    - Khi các thực thể không tồn tại trong thiết kế mạng,
    - Hệ thống sẽ lấy tài nguyên tự động nhằm kết xuất tổng hợp
    - Thiết kế được phép đặt lên nhau (Việc kết nối ngược không hoạt động)
    - (Số lượng tại tài nguyên phải luôn duy trì đủ trên mạng trung tâm)
    - ''
    - '<click_info>Tiêu tốn nguồn điện tại nguồn tổng: &7640 cho lần tạo ra'
  NTW_EXPANSION_ADVANCED_AUTO_CRAFTING_WITHHOLDING:
    name: Bộ Phận Thiết Lập Tự Động Nâng Cao (Phiên Bản Hạn Chế)
    lore:
    - Máy tổng hợp tự động cần dự án Máy Tổng hợp để tiến hành.
    - Vì các thiết kế chưa thể tạo thực thể có sẵn trực tuyến,
    - Máy móc lập tức phân tích các tài nguyên lấy được nhằm tạo ra thiết kế
    - Bạn có quyền gộp cấu hình lại với nhau (Sự kết hợp này có thể gây sai phạm do
      vấn đề phiên bản)
    - (Lưu lượng hàng hóa phải được cung cấp liên tục qua kho tổng)
    - ''
    - Thiết bị chế tạo dùng riêng sẽ tiến hành lắp rắp thông số tổng quát
    - Tính cho đến lúc thanh trượt ở ngoài xuất hiện 1 đối tượng
    - Thực thể sẽ được lưu lại ở trang truy cập chung của máy chủ
    - Nó còn có thể di chuyển ra do hệ thống đẩy tự động
    - ''
    - '<click_info>Nguồn năng lượng lấy tại lưới tổng: &71,280 một lượt vận hành lắp
      ráp'
  NTW_EXPANSION_BRIDGE_ORDINAL:
    name: Cầu nối mạng (Trong suốt)
    lore:
    - Cầu nối mạng được dùng cho kết nối nhiều hệ thống đối tượng mạng khác nhau
    - Từ đó kiến thiết 1 cấu trúc kết nối tổng
    - Bố trí mạng lưới sẽ trở nên tinh tế hơn bao giờ hết
  NTW_EXPANSION_BRIDGE_WHITE:
    name: Đầu nối mạng (Màu trắng)
    lore:
    - Cầu mạng đóng vai trò thiết lập một mạng đa nhiệm các máy
    - Xây dựng thành một mạng khép kín, hoạt động độc lập
    - Giúp quy hoạch kiến trúc máy móc rõ ràng hơn
  NTW_EXPANSION_BRIDGE_LIGHT_GRAY:
    name: Cầu mạng (Màu xám nhạt)
    lore:
    - Khối cầu đóng vai trò kết hợp nhiều bộ xử lý thông qua hệ thống
    - Để tạo nên hệ thống máy tự động quy mô hoàn chỉnh
    - Bản thiết kế đường truyền của mạng sẽ không còn rối rắm
  NTW_EXPANSION_BRIDGE_GRAY:
    name: Liên kết cầu (Màu xám)
    lore:
    - Kết nối cầu truyền dữ liệu tới thiết bị mạng
    - Và tổ hợp chúng thành cấu trúc lớn
    - Cách phân bổ sơ đồ tổng của hệ thống tốt hơn
  NTW_EXPANSION_BRIDGE_BLACK:
    name: Cầu liên kết mạng (Màu đen)
    lore:
    - Mạng cầu có các đặc trưng dùng nối kết trang bị
    - Từ các trang bị tạo thành 1 tổng thể khổng lồ
    - Phân tách cách sắp xếp thông số của hệ thống rành mạch
  NTW_EXPANSION_BRIDGE_BROWN:
    name: Mạng lưới kết nối (Màu nâu)
    lore:
    - Khối nối mạng gắn kết các cổng của đa máy chủ lại với nhau
    - Đến hệ thống hợp nhất mạng chung nhất
    - Cấu tạo chi tiết các đường dẫn lưới mạng minh bạch
  NTW_EXPANSION_BRIDGE_RED:
    name: Cầu lưới điện (Màu đỏ)
    lore:
    - Cáp lưới điện sử dụng công nghệ gắn kết thiết bị thuộc mạng khác nhau
    - Cho một hệ mạng hoàn hảo tuyệt đối
    - Tối ưu lại sự sắp xếp mạng lưới sao cho hiển thị nhất
  NTW_EXPANSION_BRIDGE_ORANGE:
    name: Đầu truyền (Màu cam)
    lore:
    - Cổng truyền đảm bảo cho việc liên kết ở vô số mạng
    - Với các đặc trưng ưu việt của 1 mạng máy tính tổng
    - Lưới sẽ trong sạch hơn nhờ khả năng làm gọn đường dẫn
  NTW_EXPANSION_BRIDGE_YELLOW:
    name: Đầu truyền tải (Màu vàng)
    lore:
    - Cầu máy được dành trong liên thông thông số phần cứng
    - Làm thành 1 lưới thông tin đầy đủ, hiệu quả
    - Rõ ràng chi tiết hệ thống quy hoạch điện mạng lưới
  NTW_EXPANSION_BRIDGE_LIME:
    name: Bridge mạng (Xanh lá chanh)
    lore:
    - Bộ phát truyền mạng được áp dụng để nối hệ thống mạng qua nhiều phần
    - Cho hệ mạng rộng khắp tới cấu tạo tối ưu
    - Đường đi lưới được quy hoạch hoàn chỉnh, tinh tế
  NTW_EXPANSION_BRIDGE_GREEN:
    name: Dây mạng cầu nối (Màu xanh lá)
    lore:
    - Kết cấu cầu nối có các tùy chọn ghép nối từ những cổng thiết bị
    - Sắp xếp cấu trúc máy để lập nên bộ máy mạng hoàn chỉnh
    - Mạng lưới vận hành không tốn công theo dõi
  NTW_EXPANSION_BRIDGE_CYAN:
    name: Trạm kết nối lưới (Màu lục lam)
    lore:
    - Máy nối tạo các điểm truyền trên những máy móc cần hệ thống
    - Dựng 1 bộ xử lý trung tâm điều khiển đường lưới
    - Phân luồng định tuyến chi tiết hơn nữa
  NTW_EXPANSION_BRIDGE_LIGHT_BLUE:
    name: Điểm nối lưới (Màu xanh nhạt)
    lore:
    - Trạm kết nối mạng nhằm vào liên kết giữa cỗ máy vật phẩm
    - Làm phát triển bộ định tuyến toàn năng của cỗ máy tổng
    - Sơ đồ điều chỉnh thiết bị mạch lạc rành rọt
  NTW_EXPANSION_BRIDGE_BLUE:
    name: Cầu nối (Màu xanh da trời)
    lore:
    - Điểm chia cầu có thể nối chung nhiều công cụ thông tin thuộc mạng
    - Cho nên tạo hệ điều hành đầy đủ chức năng xử lý
    - Hệ thống của cả cơ cấu sẽ dễ nhìn nhất có thể
  NTW_EXPANSION_BRIDGE_PURPLE:
    name: Trạm cầu nối mạng (Màu tím)
    lore:
    - Hệ truyền liên kết dành riêng cho các thành phần nằm trong mạng trực tuyến
    - Phân luồng 1 tổng bộ điều phối cho hệ mạng chung
    - Kế hoạch lắp đặt không thể trong sạch và tinh gọn hơn
  NTW_EXPANSION_BRIDGE_MAGENTA:
    name: Khối liên kết (Đỏ thắm)
    lore:
    - Cầu trực tuyến cung cấp đường dẫn dữ liệu đến vô số công cụ
    - Do tính năng đa luồng hệ điều hành của mạng
    - Sự trình bày sơ đồ lưới được đánh giá hiệu quả tối đa
  NTW_EXPANSION_BRIDGE_PINK:
    name: Trạm cầu (Màu hồng)
    lore:
    - Máy nối tiếp có các cổng nối với vật dụng cùng bộ mạng
    - Vì lý do phát triển hoàn thiện thông số điều khiển
    - Việc định hình đường lưới thông suốt vượt trội
  NTW_EXPANSION_ADVANCED_QUANTUM_STORAGE:
    name: Kho lưu trữ vật phẩm công nghệ lượng tử siêu cấp
    lore:
    - Dung lượng lưu trữ tối đa được cá nhân hóa
    - Cần thông báo trước rằng chỉ số lượng thiết lập tùy chọn không ít hơn giá trị
      định sẵn
    - Dẫu không xóa về ngưỡng tối đa mức hiện tại
  NTW_EXPANSION_LINE_POWER_OUTLET_1:
    name: Ổ cắm điện chuỗi liên kết (1)
    lore:
    - Cổng điện đường truyền cung cấp năng lượng có trong hệ thống trạm mạng
    - Giao điện từ kho lên đến mục tiêu yêu cầu.
    - ''
    - '<click_info>Khả năng dự trữ: &764J'
  NTW_EXPANSION_LINE_POWER_OUTLET_2:
    name: Cổng cắm chuỗi truyền năng lượng (2)
    lore:
    - Lưới điện tiếp nối cho khả năng đưa điện vào nguồn hệ thống trạm chủ
    - Truyền điện nguồn của trạm tới cỗ máy đặc thù.
    - ''
    - '<click_info>Độ chịu tải: &7256J'
  NTW_EXPANSION_LINE_POWER_OUTLET_3:
    name: Cổng cung cấp điện lưới mạng liên kết (3)
    lore:
    - Chuỗi nối tiếp điện chuyển trực tiếp khối năng lượng
    - Đóng vai trò duy trì điện năng các hệ máy.
    - ''
    - '<click_info>Có khả năng chứa: &71,024J'
  NTW_EXPANSION_LINE_POWER_OUTLET_4:
    name: Khối lấy điện lưới đa chuỗi (4)
