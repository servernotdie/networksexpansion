    - Qua trung gian đến mục tiêu mong muốn.
    - ''
    - '<click_info>Lượng có thể lưu: &716,777,216J'
  NTW_EXPANSION_LINE_POWER_OUTLET_9:
    name: Lõi ổ kết nối dòng điện lưới (9)
    lore:
    - Dây truyền tải cung cấp điện phát ra qua trung gian tiếp nhận
    - Chuyển tiếp nguồn phát đến cụm thi công.
    - ''
    - '<click_info>Có sẵn trong bộ dự trữ: &7134,217,728J'
  NTW_EXPANSION_LINE_POWER_OUTLET_10:
    name: Dây cáp nguồn chuỗi mạng phân tuyến (10)
    lore:
    - Ổ cắm liên tiếp đường dây mạng cho phép cung cấp dòng vào điện thế
    - Giao cho điểm đến đích phân chia hệ thống.
    - ''
    - '<click_info>Cho phép giữ lại lượng điện: &71,073,741,824J'
  NTW_EXPANSION_LINE_POWER_OUTLET_11:
    name: Hệ thống điện cổng chuỗi (11)
    lore:
    - Cụm ổ nối thiết bị điện phát dòng của hệ thống năng lượng vào điểm đến
    - Theo kế hoạch tới trung tâm chỉ định trước.
    - ''
    - '<click_info>Dung lượng chịu đựng: &72,147,483,647J'
