    - Cung cấp tới hệ thống tiêu thụ đầu cuối.
    - ''
    - '<click_info>Năng lượng tối đa: &74,096J'
  NTW_EXPANSION_LINE_POWER_OUTLET_5:
    name: Cổng tiếp nhận điện chuỗi (5)
